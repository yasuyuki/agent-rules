[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-rules"
version = "0.1.0"
description = "Safely place explicit rule and skill sources with pinned Rulesync"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
]

[project.urls]
Source = "https://github.com/yasuyuki/agent-rules"

[project.scripts]
agent-rules = "agent_rules_manager.project:main"

[tool.setuptools]
packages = ["agent_rules_manager"]
package-dir = {agent_rules_manager = "."}
include-package-data = false

[tool.setuptools.package-data]
agent_rules_manager = ["bin/rulesync_backend.py", "package.json", "package-lock.json"]
