name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python tests/test_rules.py
      - run: python tests/test_push_preflight.py
      - run: python tests/test_agent_report.py
      - run: python tests/test_verification_skill.py
      - run: python -m pip install build twine
      - run: python -m build
      - name: Validate distribution metadata
        shell: bash
        run: python -m twine check --strict dist/*
      - name: Install and test the wheel outside the checkout
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/agent-rules-runtime"
          if [ "$RUNNER_OS" = Windows ]; then
            runtime="$RUNNER_TEMP/agent-rules-runtime/Scripts"
          else
            runtime="$RUNNER_TEMP/agent-rules-runtime/bin"
          fi
          "$runtime/python" -m pip install --no-index dist/*.whl
          "$runtime/python" tests/test_project.py
          cd "$RUNNER_TEMP"
          "$runtime/agent-rules" --version
          "$runtime/agent-rules" --help
