name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# Replace only older evidence for the same workflow/event/ref (or PR).
# Push head, PR merge and integrated main remain distinct evidence.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"

jobs:
  documentation:
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.changes.outputs.full }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Classify the complete event range
        id: changes
        run: python tests/ci_changes.py
      - name: Documentation references and CI selection contract
        run: python tests/ci_runner.py --output ci-results/documentation.json --timeout 300 test_docs_check test_ci_changes
      - name: Check maintained documentation
        run: python tests/docs_check.py
      - name: README distribution metadata
        if: steps.changes.outputs.full == 'false' && steps.changes.outputs.readme == 'true'
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
      - name: Retain timings and outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-results-documentation-${{ github.run_attempt }}
          path: ci-results/
          if-no-files-found: error

  checkout:
    needs: documentation
    if: needs.documentation.outputs.full == 'true'
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci --ignore-scripts
      - name: Install fixed external lifecycle for checkout compatibility contracts
        run: python -m pip install "workspace-lifecycle @ https://github.com/yasuyuki/workspace-lifecycle/archive/fdd4f16a11e095b8ea49c8a7d40ff49307ed738d.zip"
      - name: Rulesync safety contract
        run: python tests/ci_runner.py --output ci-results/rulesync.json --timeout 300 test_rulesync_backend test_rulesync_export
      - name: Handoff contract
        run: python tests/ci_runner.py --output ci-results/handoff.json --timeout 300 --command python tests/test_handoff.py
      - name: Placement and rules contract
        run: python tests/ci_runner.py --output ci-results/rules.json --timeout 300 --command python tests/test_rules.py
      - name: Source regression contracts
        run: python tests/ci_runner.py --output ci-results/source.json --timeout 300 test_grok_placement test_start_config test_inventory_adoption test_inventory_inspection test_agent_report test_workspace_entry test_ci_runner test_verification_skill
      - name: Record resolved dependencies
        if: always()
        shell: bash
        run: |
          mkdir -p ci-results
          python -m pip freeze > ci-results/build-dependencies.txt
          python -VV > ci-results/python.txt
          git --version > ci-results/git.txt
      - name: Retain timings and outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-results-checkout-${{ matrix.os }}-${{ matrix.python }}-${{ github.run_attempt }}
          path: ci-results/
          if-no-files-found: error

  package:
    needs: documentation
    if: needs.documentation.outputs.full == 'true'
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci --ignore-scripts
      - run: python -m pip install build twine
      - run: python -m build
      - name: Validate distribution metadata
        shell: bash
        run: python -m twine check --strict dist/*
      - name: Install and test the wheel outside the checkout
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/agent-rules-runtime"
          if [ "$RUNNER_OS" = Windows ]; then
            runtime="$RUNNER_TEMP/agent-rules-runtime/Scripts"
          else
            runtime="$RUNNER_TEMP/agent-rules-runtime/bin"
          fi
          "$runtime/python" -c "import importlib.util,sys; sys.exit(importlib.util.find_spec('agent_rules_manager') is not None)"
          "$runtime/python" -m pip install --no-index dist/*.whl
          export RULESYNC_EXECUTABLE="$GITHUB_WORKSPACE/node_modules/.bin/rulesync"
          if [ "$RUNNER_OS" = Windows ]; then
            export RULESYNC_EXECUTABLE="$GITHUB_WORKSPACE/node_modules/.bin/rulesync.cmd"
          fi
          "$runtime/python" tests/ci_runner.py --output ci-results/project.json --timeout 300 test_project
          cd "$RUNNER_TEMP"
          "$runtime/agent-rules" --version
          "$runtime/agent-rules" --help
          "$runtime/python" -m pip uninstall -y agent-rules
          "$runtime/python" -c "import importlib.util,sys; sys.exit(importlib.util.find_spec('agent_rules_manager') is not None)"
      - name: Smoke source installation with the same rule and skill fixture
        if: matrix.python == '3.12'
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/agent-rules-source-runtime"
          if [ "$RUNNER_OS" = Windows ]; then
            source_runtime="$RUNNER_TEMP/agent-rules-source-runtime/Scripts"
            export RULESYNC_EXECUTABLE="$GITHUB_WORKSPACE/node_modules/.bin/rulesync.cmd"
          else
            source_runtime="$RUNNER_TEMP/agent-rules-source-runtime/bin"
            export RULESYNC_EXECUTABLE="$GITHUB_WORKSPACE/node_modules/.bin/rulesync"
          fi
          "$source_runtime/python" -c "import importlib.util,sys; sys.exit(importlib.util.find_spec('agent_rules_manager') is not None)"
          "$source_runtime/python" -m pip install .
          "$source_runtime/python" tests/test_project.py -k test_native_probe_offline_round_trip
          "$source_runtime/python" -m pip uninstall -y agent-rules
          "$source_runtime/python" -c "import importlib.util,sys; sys.exit(importlib.util.find_spec('agent_rules_manager') is not None)"
      - name: Record resolved dependencies
        if: always()
        shell: bash
        run: |
          mkdir -p ci-results
          python -m pip freeze > ci-results/build-dependencies.txt
          python -VV > ci-results/python.txt
          git --version > ci-results/git.txt
      - name: Retain timings and outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-results-package-${{ matrix.os }}-${{ matrix.python }}-${{ github.run_attempt }}
          path: ci-results/
          if-no-files-found: error

  # Preserve the existing check names and require every configuration/partition.
  # always() makes failure, cancellation and unexpected skips explicit failures.
  test:
    needs: [documentation, checkout, package]
    if: always()
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Require all verification results
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python tests/ci_changes.py --gate
