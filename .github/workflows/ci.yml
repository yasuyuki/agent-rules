name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# Replace only older evidence for the same workflow/event/ref (or PR).
# Push head, PR merge and integrated main remain distinct evidence.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"

jobs:
  documentation:
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.changes.outputs.full }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Classify the complete event range
        id: changes
        run: python tests/ci_changes.py
      - name: Documentation references and CI selection contract
        run: python tests/ci_runner.py --output ci-results/documentation.json --timeout 300 test_docs_check test_ci_changes
      - name: Check maintained documentation
        run: python tests/docs_check.py
      - name: README distribution metadata
        if: steps.changes.outputs.full == 'false' && steps.changes.outputs.readme == 'true'
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
      - name: Retain timings and outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-results-documentation-${{ github.run_attempt }}
          path: ci-results/
          if-no-files-found: error

  checkout:
    needs: documentation
    if: needs.documentation.outputs.full == 'true'
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
        shard: [0, 1]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Optional necessity parser dependencies
        run: python -m pip install bashlex==0.18 tomli
      - name: Opt-in necessity hooks contract
        if: matrix.shard == 0
        run: python tests/ci_runner.py --output ci-results/necessity.json --timeout 300 test_necessity_select test_necessity_hook test_necessity_install test_necessity_review
      - name: Handoff contract
        if: matrix.shard == 0
        run: python tests/ci_runner.py --output ci-results/handoff.json --timeout 300 --command python tests/test_handoff.py
      - name: Placement and rules contract
        if: matrix.shard == 0
        run: python tests/ci_runner.py --output ci-results/rules.json --timeout 300 --command python tests/test_rules.py
      - name: Source regression contracts
        if: matrix.shard == 0
        run: python tests/ci_runner.py --output ci-results/source.json --timeout 300 test_grok_placement test_start_config test_standard_start test_managed_entry test_handoff_receive test_handoff_start test_inventory_adoption test_inventory_inspection test_push_preflight test_agent_report test_branch_validation test_ci_runner test_verification_skill
      - name: Complete real-Git checkout contract
        run: python tests/ci_runner.py --output ci-results/checkout.json --timeout 900 --workers 3 --shard-count 2 --shard-index ${{ matrix.shard }} --timings tests/ci_checkout_weights.json test_branch_management test_branch_recovery test_branch_remote_adoption test_branch_operations
      - name: Record resolved dependencies
        if: always()
        shell: bash
        run: |
          mkdir -p ci-results
          python -m pip freeze > ci-results/build-dependencies.txt
          python -VV > ci-results/python.txt
          git --version > ci-results/git.txt
      - name: Retain timings and outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-results-checkout-${{ matrix.os }}-${{ matrix.python }}-${{ matrix.shard }}-${{ github.run_attempt }}
          path: ci-results/
          if-no-files-found: error

  package:
    needs: documentation
    if: needs.documentation.outputs.full == 'true'
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install build twine
      - run: python -m build
      - name: Validate distribution metadata
        shell: bash
        run: python -m twine check --strict dist/*
      - name: Install and test the wheel outside the checkout
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/agent-rules-runtime"
          if [ "$RUNNER_OS" = Windows ]; then
            runtime="$RUNNER_TEMP/agent-rules-runtime/Scripts"
          else
            runtime="$RUNNER_TEMP/agent-rules-runtime/bin"
          fi
          "$runtime/python" -m pip install --no-index dist/*.whl
          "$runtime/python" -m pip install bashlex==0.18 tomli
          "$runtime/python" tests/ci_runner.py --output ci-results/project.json --timeout 300 test_project
          installed_place=$("$runtime/python" -c 'import agent_rules_manager.bin.place as p; print(p.__file__)')
          "$runtime/python" -c 'import pathlib, agent_rules_manager.bin.place as p, agent_rules_manager.bin.branch_management as b; root=pathlib.Path.cwd().resolve(); paths=[pathlib.Path(m.__file__).resolve() for m in (p,b)]; assert all(root not in path.parents for path in paths); print(*paths, sep="\n")' > ci-results/installed-paths.txt
          # Checkout jobs cover full behavior. Retain the distinct installed boundary:
          # packaged hook/data, legacy hook, source-only catalog, and real ref guards.
          AGENT_RULES_PLACE="$installed_place" "$runtime/python" tests/ci_runner.py --output ci-results/wheel.json --timeout 600 --workers 3 \
            test_branch_management.BranchManagementTests.test_install_preserves_an_existing_hook_and_detects_tampering \
            test_branch_management.BranchManagementTests.test_packing_settings_check_and_explicit_repair \
            test_branch_management.BranchManagementTests.test_packing_repair_keeps_other_install_guards \
            test_branch_management.BranchManagementTests.test_packing_gc_failure_and_repair \
            test_branch_management.BranchManagementTests.test_packing_worktree_and_command_scope_repair \
            test_branch_management.BranchManagementTests.test_declare_agent_updates_only_a_registered_source_catalog \
            test_branch_management.BranchManagementTests.test_unregistered_refs_no_verify_and_alternate_index_are_rejected \
            test_branch_remote_adoption \
            test_branch_operations.OperationTests.test_merge_rejects_same_source_path_contamination_before_commit \
            test_branch_operations.OperationTests.test_merge_records_a_real_combined_tree \
            test_branch_operations.OperationTests.test_sync_combines_real_remote_result_and_diagnostic_is_nonwriting \
            test_branch_operations.OperationTests.test_sync_partial_index_update_keeps_the_original_receipt_for_resume
          cd "$RUNNER_TEMP"
          "$runtime/agent-rules" --version
          "$runtime/agent-rules" --help
      - name: Record resolved dependencies
        if: always()
        shell: bash
        run: |
          mkdir -p ci-results
          python -m pip freeze > ci-results/build-dependencies.txt
          python -VV > ci-results/python.txt
          git --version > ci-results/git.txt
      - name: Retain timings and outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-results-package-${{ matrix.os }}-${{ matrix.python }}-${{ github.run_attempt }}
          path: ci-results/
          if-no-files-found: error

  # Preserve the existing check names and require every configuration/partition.
  # always() makes failure, cancellation and unexpected skips explicit failures.
  test:
    needs: [documentation, checkout, package]
    if: always()
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Require all verification results
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python tests/ci_changes.py --gate
